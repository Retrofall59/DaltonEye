plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tomyn.daltoneye'
    compileSdk 34

    // Cle de signature FIXE pour la version debug : sans elle, chaque build GitHub Actions genere une cle neuve
    // et Android refuse d'installer la mise a jour par-dessus l'ancienne version (desinstallation obligatoire).
    // Cette cle est publique (dans le depot) : elle ne prouve rien sur l'auteur, elle sert juste a garder la meme signature.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.tomyn.daltoneye"
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName "1.26"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX : flux camera en direct + analyse image par image, sans stocker de photos
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
